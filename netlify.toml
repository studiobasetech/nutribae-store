# Netlify settings. Free tier is enough for this store.
[build]
  publish = "public"
  functions = "netlify/functions"

# Local dev server (npm run dev)
# Open http://localhost:8888. staticServerPort is an internal helper port;
# it was moved off 3999 because something else on this Mac uses that port.
[dev]
  port = 8888
  staticServerPort = 4999

[functions]
  node_bundler = "esbuild"

# The cookbook PDF is bundled with its function (not public).
[functions.cookbook]
  included_files = ["netlify/assets/**"]

# App notifications: reminders go out every hour, at each person's local time.
[functions.push-daily]
  schedule = "@hourly"

# Cart, checkout and review reminders.
[functions.reminders]
  schedule = "@hourly"

# Friendly URLs for the functions
[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200

