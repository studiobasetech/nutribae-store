<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sweet Kitchen recipes — NutriBae</title>
  <meta name="description" content="25 dessert-inspired, high-protein recipes made with NutriBae plant-based protein.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F19EC8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="recipes" data-app>
  <div id="site-top"></div>

  <main>
    <section class="app-hero">
      <div class="container">
        <p class="app-eyebrow">Sweet Kitchen</p>
        <h1 class="app-title">Treats that love you back</h1>
        <p class="app-sub">25 recipes from <em>Wellness Made Sweet</em>, each made with NutriBae plant-based protein.</p>
      </div>
    </section>

    <section class="container rb-controls" aria-label="Filter recipes">
      <label class="rb-search">
        <span class="sr-only">Search recipes</span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l4.5 4.5"/></svg>
        <input type="search" placeholder="Search: cookies, banana, latte…" data-rb-search>
      </label>
      <div class="chips" role="group" aria-label="Type" data-rb-types></div>
      <div class="chips" role="group" aria-label="Protein flavor" data-rb-flavors></div>
    </section>

    <section class="container">
      <div data-rb-banner></div>
      <p class="rb-count" data-rb-count aria-live="polite"></p>
      <ul class="rb-grid" data-rb-grid></ul>
    </section>
  </main>

  <!-- Recipe detail -->
  <dialog class="sheet" data-rb-dialog aria-labelledby="rb-title">
    <div class="sheet__inner" data-rb-detail></div>
  </dialog>

  <!-- Cook mode -->
  <div class="cook" data-cook hidden role="dialog" aria-modal="true" aria-labelledby="cook-title"></div>

  <div id="site-bottom"></div>

  <script src="js/products.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/spin.js"></script>
  <script src="js/app-store.js"></script>
  <script src="js/recipes-data.js"></script>
  <script src="js/recipes.js"></script>
</body>
</html>
