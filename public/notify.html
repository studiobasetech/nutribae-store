<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send a notification — NutriBae</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/images/favicon-512.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F19EC8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="notify">
  <div id="site-top"></div>
  <main>
    <header class="page-head">
      <h1>Send a notification</h1>
      <p>Goes to everyone who turned on “Deals &amp; new flavors”.</p>
    </header>
    <div class="container">
      <form class="notify-form" data-notify-form>
        <label>Password<input type="password" name="key" autocomplete="current-password" required></label>
        <label>Title <small>(up to 60 characters)</small><input name="title" maxlength="60" required placeholder="New flavor alert 🍓"></label>
        <label>Message <small>(up to 180 characters)</small><textarea name="body" maxlength="180" required placeholder="Strawberry Shortcake is here. Get 15% off with Subscribe &amp; Save."></textarea></label>
        <label>Opens this page<select name="url">
          <option value="/shop.html">Shop</option><option value="/index.html">Home</option><option value="/recipes.html">Recipes</option>
          <option value="/my-day.html">My Sweet Day</option><option value="/plan.html">Sweet Plan quiz</option><option value="/swap.html">Sweet Swap</option>
        </select></label>
        <button class="btn" type="submit">Send to everyone</button>
        <p class="form-msg" role="status" data-notify-msg></p>
      </form>
    </div>
  </main>
  <div id="site-bottom"></div>
  <script src="js/products.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/notify-admin.js"></script>
</body>
</html>
